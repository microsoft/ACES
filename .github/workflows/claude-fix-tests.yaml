name: Claude Fix Tests

on:
  workflow_dispatch:
    inputs:
      test_file:
        description: "Path to the failing test file (e.g., tests/scoring/test_strategies.py)"
        required: false
        type: string
      module:
        description: "Module path (e.g., tests/scoring, tests/config)"
        required: false
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: read

jobs:
  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Reproduce failure
        id: reproduce
        continue-on-error: true
        run: |
          if [ -n "${{ inputs.test_file }}" ]; then
            uv run pytest "${{ inputs.test_file }}" -v 2>&1 | tee /tmp/test_output.log
          elif [ -n "${{ inputs.module }}" ]; then
            uv run pytest "${{ inputs.module }}/" -v 2>&1 | tee /tmp/test_output.log
          else
            uv run pytest -v 2>&1 | tee /tmp/test_output.log
          fi

      - name: Run Claude Code to fix failures
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are an autonomous CI-fix agent. Read AGENTS.md for repo context,
            especially the "Fix A Failing Test" workflow in the ci-maintenance-workflow skill.

            ## Context
            Test file: ${{ inputs.test_file || 'all' }}
            Module: ${{ inputs.module || 'all' }}
            Test output is in /tmp/test_output.log

            ## Instructions
            1. Read the test output to identify the failure
            2. Read the failing test code
            3. Read the implementation it tests
            4. Identify root cause
            5. Implement minimal fix
            6. Verify fix: `uv run pytest <test_file> -v`
            7. Run lint: `uv run ruff check`
            8. Commit with descriptive message
            9. Create a draft PR with: The bug, Error message, Root cause, Fix, Validation
