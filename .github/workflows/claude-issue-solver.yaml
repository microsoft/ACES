name: Claude Issue Solver

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to solve"
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  solve-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validate trigger and permissions
        id: validate
        uses: actions/github-script@v7
        env:
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            // workflow_dispatch: fetch issue from API
            if (context.eventName === 'workflow_dispatch') {
              const issueNumber = Number(process.env.INPUT_ISSUE_NUMBER);
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
              });

              if (issue.pull_request) {
                core.setFailed(`#${issueNumber} is a pull request, not an issue`);
                core.setOutput('skip', 'true');
                return;
              }

              const labels = issue.labels.map(l => l.name);
              core.setOutput('skip', 'false');
              core.setOutput('issue_number', issueNumber.toString());
              core.setOutput('issue_title', issue.title);
              core.setOutput('issue_labels', JSON.stringify(labels));
              return;
            }

            // issue_comment: validate /claude command and permissions
            const body = context.payload.comment.body.trim();
            if (body !== '/claude') {
              core.info('Comment is not /claude — skipping');
              core.setOutput('skip', 'true');
              return;
            }

            if (context.payload.issue.pull_request) {
              core.info('Comment is on a pull request, not an issue — skipping');
              core.setOutput('skip', 'true');
              return;
            }

            // Check commenter has write or admin permission
            const commenter = context.payload.comment.user.login;
            const { data: permData } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: commenter,
            });
            const perm = permData.permission;
            if (perm !== 'write' && perm !== 'admin') {
              core.info(`Commenter ${commenter} has permission ${perm} — skipping`);

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `@${commenter} The \`/claude\` command is restricted to users with write access to the repository.`,
              });

              core.setOutput('skip', 'true');
              return;
            }

            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);

            core.setOutput('skip', 'false');
            core.setOutput('issue_number', issue.number.toString());
            core.setOutput('issue_title', issue.title);
            core.setOutput('issue_labels', JSON.stringify(labels));

      - name: Checkout
        if: steps.validate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        if: steps.validate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        if: steps.validate.outputs.skip != 'true'
        run: uv sync --all-extras

      - name: Run Claude Code to solve issue
        if: steps.validate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are an autonomous issue-solving agent. Read AGENTS.md and CLAUDE.md
            for repo context.

            ## Issue
            Number: #${{ steps.validate.outputs.issue_number }}
            Title: ${{ steps.validate.outputs.issue_title }}
            Labels: ${{ steps.validate.outputs.issue_labels }}

            ## Instructions
            1. Read the full issue body and comments
            2. Understand the problem (read relevant code in src/saber/ or domains/)
            3. Create a fix branch: `git checkout -b fix/issue-${{ steps.validate.outputs.issue_number }}`
            4. Implement the fix
            5. Add/update tests
            6. Run tests: `uv run pytest tests/ -v`
            7. Run lint: `uv run ruff check`
            8. Commit and push
            9. Create a draft PR linking to the issue

            ALL production code must be human-reviewed before merge.
