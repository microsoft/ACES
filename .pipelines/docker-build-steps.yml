# Azure DevOps pipeline steps for building Docker images.
# These steps use ADO artifact feeds and container registries (Microsoft internal).
# For GitHub-based builds, use GitHub Actions or adapt the Dockerfiles directly.
steps:
  - task: Docker@2
    displayName: Docker - Build Server Image
    env:
      DOCKER_BUILDKIT: '1'
      ADO_TOKEN: $(System.AccessToken)
    inputs:
      command: build
      repository: saber-server
      containerRegistry: benchmarking-spear-stg-acr
      dockerfile: docker/Dockerfile.saber_server
      buildContext: .
      arguments: |
        --secret id=ADO_TOKEN,env=ADO_TOKEN
        --build-arg FEED_ORG=MSECAIModels
        --build-arg FEED_PROJECT=Benchmarking
        --build-arg FEED_NAME=Benchmarking
      tags: |
        $(MAJOR).$(MINOR).$(PATCH)
        latest

  - task: Docker@2
    displayName: Docker - Build Sandbox Image
    env:
      DOCKER_BUILDKIT: '1'
      ADO_TOKEN: $(System.AccessToken)
    inputs:
      command: build
      repository: saber-sandbox
      containerRegistry: benchmarking-spear-stg-acr
      dockerfile: docker/Dockerfile.saber_sandbox
      buildContext: .
      arguments: |
        --secret id=ADO_TOKEN,env=ADO_TOKEN
        --build-arg FEED_ORG=MSECAIModels
        --build-arg FEED_PROJECT=Benchmarking
        --build-arg FEED_NAME=Benchmarking
      tags: |
        $(MAJOR).$(MINOR).$(PATCH)
        latest
