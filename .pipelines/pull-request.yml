# Dev branch pipeline: Lint and Unit Tests
# Runs on PRs to dev and pushes to dev

trigger:
  branches:
    include:
      - dev

pr:
  branches:
    include:
      - dev

pool:
  vmImage: ubuntu-latest

variables:
  MAJOR: 0
  MINOR: 2
  PATCH: dev$(Build.BuildId)

name: SABER-Dev-$(MAJOR).$(MINOR).$(PATCH)

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Lint and Unit Tests'
        steps:
          - template: /.pipelines/python-build-test-steps.yml
