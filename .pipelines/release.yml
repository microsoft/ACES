# Main branch pipeline: Lint, Unit Tests, and Docker Build/Push
# Runs on PRs to main and pushes to main

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  MAJOR: 0
  MINOR: 2
  PATCH: $[counter(format('{0}.{1}', variables['MAJOR'], variables['MINOR']), 0)]

name: SABER-Release-$(MAJOR).$(MINOR).$(PATCH)

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildAndTest
        displayName: 'Lint and Unit Tests'
        steps:
          - template: /.pipelines/python-build-test-steps.yml

  - stage: Docker
    displayName: 'Docker Build and Push'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DockerBuildPush
        displayName: 'Build and Push Docker Images'
        steps:
          - template: /.pipelines/docker-build-steps.yml
          - template: /.pipelines/docker-push-steps.yml
