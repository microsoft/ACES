repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: README.md
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src/|domains/)
        exclude: ^(.*/.archive/.*|.*/targets/.*|examples/)
      - id: ruff-format
        files: ^(src/|domains/)
        exclude: ^(.*/.archive/.*|.*/targets/.*)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pydantic, types-PyYAML, types-click, types-requests]
