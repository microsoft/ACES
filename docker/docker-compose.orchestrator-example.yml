version: '3.8'

# Example Docker Compose template showing SABER Episode Orchestrator integration
# This template is generated dynamically by SABER with session-specific values

services:
  # SABER Episode Orchestrator - monitors episode status and manages container lifecycle
  saber-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: saber-orchestrator-${SABER_SESSION_ID}
    environment:
      - SABER_SESSION_ID=${SABER_SESSION_ID}
      - SABER_CLEANUP_TOKEN=${SABER_CLEANUP_TOKEN}
      - SABER_HOST_URL=${SABER_HOST_URL:-http://host.docker.internal:8000}
      - SABER_POLL_INTERVAL=${SABER_POLL_INTERVAL:-30}
      - SABER_COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME}
      - SABER_COMPOSE_FILE=/app/docker-compose.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Required for Docker commands
      - .:/app  # Mount compose file directory
    labels:
      - "saber.session_id=${SABER_SESSION_ID}"
      - "saber.role=orchestrator"
      - "saber.cleanup_token=${SABER_CLEANUP_TOKEN}"
    restart: unless-stopped
    networks:
      - saber-episode-network

  # Execution container - where agent commands are executed
  execution:
    image: saber-execution:latest
    container_name: saber-execution-${SABER_SESSION_ID}
    environment:
      - SABER_SESSION_ID=${SABER_SESSION_ID}
      # No need for cleanup token - orchestrator handles cleanup
    volumes:
      - execution-workspace:/workspace
    labels:
      - "saber.session_id=${SABER_SESSION_ID}"
      - "saber.role=execution"
      - "saber.cleanup_token=${SABER_CLEANUP_TOKEN}"
    working_dir: /workspace
    networks:
      - saber-episode-network
    depends_on:
      - saber-orchestrator

  # Example target service - vulnerable web application
  webapp:
    image: nginx:latest
    container_name: saber-webapp-${SABER_SESSION_ID}
    ports:
      - "8080:80"
    labels:
      - "saber.session_id=${SABER_SESSION_ID}"
      - "saber.role=target"
      - "saber.cleanup_token=${SABER_CLEANUP_TOKEN}"
    networks:
      - saber-episode-network
    depends_on:
      - saber-orchestrator

  # Example database service
  database:
    image: postgres:13
    container_name: saber-db-${SABER_SESSION_ID}
    environment:
      - POSTGRES_DB=testdb
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
    labels:
      - "saber.session_id=${SABER_SESSION_ID}"
      - "saber.role=target"
      - "saber.cleanup_token=${SABER_CLEANUP_TOKEN}"
    networks:
      - saber-episode-network
    depends_on:
      - saber-orchestrator

networks:
  saber-episode-network:
    name: saber-${SABER_SESSION_ID}
    driver: bridge
    labels:
      - "saber.session_id=${SABER_SESSION_ID}"

volumes:
  execution-workspace:
    name: saber-workspace-${SABER_SESSION_ID}
    labels:
      - "saber.session_id=${SABER_SESSION_ID}"
