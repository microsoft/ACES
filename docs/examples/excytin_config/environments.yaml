# Environment Template Definitions
# Reusable container and network configurations

# Container Templates
containers:
  # Execution environments
  execution_sandbox:
    image: "saber/execution-sandbox:latest"
    working_dir: "/workspace"
    user: "excytin:excytin"
    tools:
      - "nmap"
      - "sqlmap"
      - "burpsuite"
      - "metasploit"
    resource_limits:
      memory: "1g"
      cpu: "0.5"

  excytin_db1:
    image: "mysql:5.7"
    environment:
      - "MYSQL_ROOT_PASSWORD=example"
      - "MYSQL_DATABASE=example"
      - "MYSQL_USER=example"
      - "MYSQL_PASSWORD=password"
    volumes:
      - "/tmp/mysql-data:/var/lib/mysql:rw"
    health_check:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: "30s"
      timeout: "10s"
      retries: 5
      start_period: "30s"

# Network Templates
networks:
  # Isolated network for excytin scenarios
  excytin_network:
    driver: "bridge"
    internal: true  # No external network access
    ipam:
      config:
        - subnet: "172.20.0.0/16"
    options:
      com.docker.network.bridge.name: "excytin-br"

# Environment Compositions - Predefined combinations
environments:
  # Full Excytin test env for db1
  excytin_db1:
    network: "excytin_network"
    execution: "execution_sandbox"
    services:
      - name: "db1"
        container: "excytin_db1"
    resource_limits:
      total_memory: "2g"
      total_cpu: "1.5"
      execution_timeout: 600
