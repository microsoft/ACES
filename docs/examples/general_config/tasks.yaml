# Test Tasks Configuration with Multi-Container Environment Support
domain: "security_test"

tasks:
  # Simple template reference approach
  - task_id: "dvwa_sql_injection_simple"
    title: "SQL Injection Attack (Template Approach)"
    description: "Simple task using predefined environment template"

    # Simple template reference
    environment: "dvwa_pentest"

    subtasks:
      - subtask_id: "exploitation"
        title: "Exploit SQL Injection"
        description: "Target is available at http://webapp/"
        objective: "Find and exploit SQL injection vulnerabilities in the DVWA application"

  # Granular container selection approach
  - task_id: "custom_pentest_lab"
    title: "Custom Pentesting Lab (Granular Approach)"
    description: "Custom task using granular container selection"

    # Granular container selection
    environment:
      network: "pentest_isolated"
      execution: "pentesting_sandbox"
      services:
        - name: "webapp"
          container: "dvwa_webapp"
        - name: "database"
          container: "dvwa_database"
        - name: "ftp"
          container: "vulnerable_ftp"

    subtasks:
      - subtask_id: "multi_service_recon"
        title: "Multi-Service Reconnaissance"
        description: "Scan webapp, database, and ftp services"
        objective: "Perform reconnaissance across all available services"

  # Network investigation task (single container)
  - task_id: "network_investigation"
    title: "Network Investigation (Single Container)"
    description: "Simple investigation task with just execution environment"

    # Just execution container, no additional services
    environment:
      network: "investigation_monitored"
      execution: "network_investigation_sandbox"
      services: []

    subtasks:
      - subtask_id: "connection_analysis"
        title: "Analyze Network Connections"
        description: "Investigate network activity on the host"
        objective: "Document all network connections and activity"

  # Task without environment (fallback to default)
  - task_id: "basic_analysis"
    title: "Basic Analysis Task"
    description: "Task without specific environment requirements"

    subtasks:
      - subtask_id: "simple_task"
        title: "Simple Analysis"
        description: "Perform basic analysis"
        objective: "Complete basic analysis task"
