# Unified Task Configuration Examples
# Shows how both template reference and granular approaches work together

# ========================================
# APPROACH 1: Template Reference (Simple)
# ========================================
tasks:
  - task_id: "dvwa_sql_injection_simple"
    title: "SQL Injection Attack (Template Approach)"
    description: "Simple task using predefined environment template"
    
    # Simple template reference
    environment: "dvwa_pentest"
    
    # Optional overrides
    environment_overrides:
      resource_limits:
        execution_timeout: 900
      services:
        webapp:
          environment:
            - "SECURITY_LEVEL=medium"
    
    subtasks:
      - subtask_id: "exploitation"
        title: "Exploit SQL Injection"
        description: "Target is available at http://webapp/"

  # ========================================
  # APPROACH 2: Granular Selection (Flexible)
  # ========================================
  - task_id: "custom_pentest_lab"
    title: "Custom Pentesting Lab (Granular Approach)"
    description: "Custom task using granular container selection"
    
    # Granular container selection
    environment:
      network: "pentest_isolated"
      execution: "pentesting_sandbox"
      services:
        - name: "webapp"
          container: "dvwa_webapp"
        - name: "database"
          container: "dvwa_database"
        - name: "ftp"
          container: "vulnerable_ftp"
    
    # Container-specific overrides
    container_overrides:
      webapp:
        environment:
          - "SECURITY_LEVEL=high"
      ftp:
        ports:
          - "2121:21"  # Custom port mapping
    
    subtasks:
      - subtask_id: "multi_service_recon"
        title: "Multi-Service Reconnaissance"
        description: "Scan webapp, database, and ftp services"

  # ========================================
  # APPROACH 3: Hybrid (Best of Both)
  # ========================================
  - task_id: "advanced_pentest"
    title: "Advanced Pentesting (Hybrid Approach)"
    description: "Starts with template, adds custom services"
    
    # Start with template base
    environment:
      base_template: "dvwa_pentest"
      additional_services:
        - name: "mail_server"
          container: "vulnerable_postfix"
        - name: "file_share"
          container: "vulnerable_samba"
      network_overrides:
        external_access: true  # Override network isolation
    
    subtasks:
      - subtask_id: "comprehensive_attack"
        title: "Multi-Vector Attack"
        description: "Attack web, database, mail, and file services"

  # ========================================
  # APPROACH 4: Environment-less (Single Container)
  # ========================================
  - task_id: "network_investigation"
    title: "Network Investigation (Single Container)"
    description: "Simple investigation task with just execution environment"
    
    # Just execution container, no additional services
    environment:
      execution: "network_investigation_sandbox"
      network: "investigation_monitored"
    
    subtasks:
      - subtask_id: "connection_analysis"
        title: "Analyze Network Connections"
        description: "Investigate network activity on the host"
