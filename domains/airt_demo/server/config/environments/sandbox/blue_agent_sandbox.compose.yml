---
# AI Red Team Blue Agent Sandbox Environment
# Protected AI Agent with Database Access and Safety Guardrails
# Ephemeral environment created per episode, torn down on completion
#
# Required Environment Variables:
# - EPISODE_ID: Unique identifier for episode isolation

services:
  ai-redteam-blue-sandbox:
    image: saber/ai_redteam/sandbox:latest
    container_name: ai-redteam-blue-sandbox-${EPISODE_ID:-default}
    working_dir: /workspace
    user: "0:0"  # Run as root for system command access
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - EPISODE_ID=${EPISODE_ID:-default}
      - AGENT_ROLE=blue_agent
      - GUARDRAILS_ENABLED=true
      - DATABASE_HOST=incident-db
      - DATABASE_PORT=3306
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=admin
      - DATABASE_NAME=env_monitor_db
    networks:
      - saber-episode-network
    depends_on:
      incident-db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.execution.service=true"
      - "saber.domain=ai_redteam"
      - "saber.service.type=sandbox"
      - "saber.service.name=ai-redteam-blue-sandbox"
      - "saber.agent.role=blue_agent"
      - "saber.injection.target=true"
      - "saber.episode.id=${EPISODE_ID:-default}"

  # Ephemeral database for this episode
  incident-db:
    image: saber/ai_redteam/incident-db:latest
    container_name: incident-db-${EPISODE_ID:-default}
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_2024
      - MYSQL_DATABASE=env_monitor_db
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin
      - EPISODE_ID=${EPISODE_ID:-default}
    networks:
      - saber-episode-network
    ports:
      - "3306"  # Dynamic port assignment
    restart: "no"
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 90s
    labels:
      - "saber.execution.service=false"
      - "saber.domain=ai_redteam"
      - "saber.service.type=database"
      - "saber.service.name=incident-db"
      - "saber.episode.id=${EPISODE_ID:-default}"

networks:
  saber-episode-network:
    external: true
    name: saber-episode-network-${EPISODE_ID:-default}
