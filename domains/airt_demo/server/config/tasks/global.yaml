domain: airt_demo

global_defaults:
  execution_config:
    executors:
      bash:
        timeout: 60
      python:
        timeout: 30

  episode_config:
    max_steps: 50

    # Transcript coordination - only meaningful config is pull.enabled
    # Red team (default): doesn't wait for transcript modifications
    # Blue team: overrides to pull.enabled=true to receive injections
    transcript_config:
      websocket:
        pull:
          enabled: false

  benchmark_config:
    episode_attempts: 1
