[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:websocket_daemon]
command=python /usr/local/bin/websocket_daemon.py
directory=/workspace
autostart=true
autorestart=true
stdout_logfile=/var/log/websocket_daemon.log
stderr_logfile=/var/log/websocket_daemon_error.log
environment=PYTHONUNBUFFERED=1

[program:tail]
command=tail -f /dev/null
autostart=true
autorestart=true
