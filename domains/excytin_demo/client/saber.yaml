# SABER Configuration - Excytin Demo
# Updated for unified eval_async architecture with proper nested configuration

# Model configuration (inspect_ai format for Azure OpenAI)
model: "openai/azure/gpt-4.1"

# Server configuration (nested structure)
server:
  rest_url: "http://saber-excytin-server:8000"
  mcp_url: "http://saber-excytin-server:8001"
  client_id: "saber-client"

# Task configuration
tasks:
  task_ids: ["excytin_demo"]

# Agent configuration (use agent registry)
agent:
  id: "react"
  debug_mode: false

# Docker commands for container setup
docker_commands:
  # Copy Azure CLI credentials from client to agent container
  - type: "copy"
    source: "/app/.azure"
    destination: "/app/.azure"
    description: "Copy Azure CLI credentials to agent home directory"
  # Fix Azure CLI file permissions as root
  - type: "exec"
    command: ["chown", "-R", "agent:agent", "/app/.azure"]
    description: "Fix ownership of Azure CLI files"
    user: "root"

# Execution configuration
log_level: "INFO"
log_dir: "./logs"
ui_enabled: true

# eval_async specific configuration
max_samples: null  # null means no limit
max_subprocesses: 1  # parallel execution
parallel_execution: true
max_parallel_tasks: 1  # Single task for demo
container_timeout: 300
