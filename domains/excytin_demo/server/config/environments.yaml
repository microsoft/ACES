# Red Agent Pentesting Environment Configuration
# Defines containers, networks, and environment templates for XSS CTF challenges

# Container Templates
containers:
  # Permanent database container - runs for server lifetime
  saber-excytin-incident-5:
    image: saber/excytin-incident-5:latest
    container_name: saber-excytin-incident-5
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: env_monitor_db
      MYSQL_ROOT_HOST: "%"
    command: --secure-file-priv=/var/lib/mysql-files --bind-address=0.0.0.0

  # Lightweight sandbox container - created per episode
  excytin-sandbox:
    image: saber/excytin-sandbox:latest
    container_name: excytin-sandbox
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"

# Environment Compositions
environments:
  # Permanent database environment - runs for server lifetime
  excytin_incident_5:
    network: "excytin-shared-network"  # Use shared network to connect to sandbox
    permanent: true  # This marks it as a permanent environment
    services:
      - name: "incident-5-db"
        container: "saber-excytin-incident-5"
    resource_limits:
      total_memory: "1g"
      total_cpu: "0.5"
      execution_timeout: null  # No timeout for permanent environments

  # Lightweight sandbox - created per episode
  excytin_sandbox:
    network: "excytin-shared-network"  # Use shared network to connect to permanent DB
    permanent_environment_connectivity: true  # Enable automatic connection to permanent networks
    execution: "excytin-sandbox"
    resource_limits:
      total_memory: "512m"
      total_cpu: "0.5"
      execution_timeout: 900

# Network Templates
networks:
  excytin-shared-network:
    driver: bridge
    external: true
    name: excytin-shared-network
