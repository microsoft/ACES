---
# Permanent services and networks for the Excytin cybersecurity domain
# This compose file defines all permanent infrastructure that runs continuously

services:
  # Incident database for storing security incidents and analysis results
  incident-5-db:
    image: saber/excytin_demo/incident-5:latest
    container_name: saber-excytin-incident-5
    ports:
      - "3306:3306"
    volumes:
      - ./server/data/sql_files/incident_5.sql:/docker-entrypoint-initdb.d/incident_5.sql:ro
      - ./server/data/csv_files/incident_5:/var/lib/mysql-files
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: env_monitor_db
      MYSQL_ROOT_HOST: "%"
    command: --secure-file-priv=/var/lib/mysql-files --bind-address=0.0.0.0 --innodb-redo-log-capacity=2147483648 --innodb-buffer-pool-size=512M
    networks:
      - excytin-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 20s
      timeout: 30s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'
    labels:
      - "saber.domain=excytin"
      - "saber.service.type=permanent"
      - "saber.service.name=incident-5-db"
      - "saber.execution.service=true"

  # Permanent sandbox for agent tool execution (shared across all episodes)
  # Replaces per-episode sandbox containers — targeted by name via executor target_container config
  excytin-sandbox:
    image: saber/excytin_demo/sandbox:latest
    container_name: saber-excytin-sandbox
    working_dir: /workspace
    depends_on:
      incident-5-db:
        condition: service_healthy
    environment:
      - PYTHONPATH=/workspace
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=saber-excytin-incident-5
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=admin
      - MYSQL_DATABASE=env_monitor_db
    networks:
      - excytin-database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-d", "/workspace"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'
    labels:
      - "saber.domain=excytin"
      - "saber.service.type=permanent"
      - "saber.service.name=excytin-sandbox"

# Shared network for communication with sandbox environments
networks:
  excytin-database:
    driver: bridge
    labels:
      - "saber.domain=excytin"
      - "saber.network.type=shared"
      - "saber.network.name=excytin-database"

# Volume mounts: SQL init files and CSV data are mounted from host
# These paths are relative to the domain root (domains/excytin_demo/)
