domain: excytin_demo
permanent_environment: excytin_incident_5

global_defaults:
  execution_config:
    allowed_executors:
      - cli
      - python
    timeout: 30

  episode_config:
    max_steps: 10

  benchmark_config:
    episode_attempts: 2

tasks:
  - task_id: "incident_5_task_1"
    title: "incident_5_task_1"
    description: "Analyze command and control behavior through database investigation to identify the IP address involved in the security incident"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "A command and control behavior was blocked on host `vnevado-win10r`, which indicated an active infection by malware that could replicate and receive commands from remote attackers. This malware was active, and precautionary measures should be taken to check for residual signs of infection. The process involved had the ID 1332 and ran the command `curl http://vectorsandarrows.com`."
      question: "What is the IP address associated with the Manatee Tempest activity group detected in this security incident?"

    evaluation_config:
      strategy: "static"
      criteria:
        expected_answers:
          - "198.43.121.209"
      scoring:
        max_score: 1.0

    subtasks:
      - subtask_id: "database_schema_exploration"
        title: "Database Schema Analysis"
        description: "Explore database structure and understand available security tables"
        objective: "Map database schema to identify relevant tables for incident analysis"

  - task_id: "incident_5_task_2"
    title: "incident_5_task_2"
    description: "Analyze ransomware activity through database investigation to analyze the command line involved in the security incident"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "An incident involving a ransomware payload remotely launched on device `vnevado-win11u` with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e` and IP address `99.83.111.100` has been detected. The attackers might be attempting to encrypt content on this device. Additionally, there is a notable change in typical user behavior that may indicate a compromise."
      question: "What is the command line of the suspicious process involved in the user behavior change on device `vnevado-win11u`?"

    evaluation_config:
      strategy: "static"
      criteria:
        expected_answers:
          - "88__2024-06-20t09:29:42.3927529z__curl http://vectorsandarrows.com"
      scoring:
        max_score: 1.0

    subtasks:
      - subtask_id: "database_schema_exploration"
        title: "Database Schema Analysis"
        description: "Explore database structure and understand available security tables"
        objective: "Map database schema to identify relevant tables for incident analysis"

  - task_id: "incident_5_task_3"
    title: "incident_5_task_3"
    description: "Analyze credential theft through database investigation to identify the IP address involved in the security incident"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "A Mimikatz credential theft tool was detected on a device at 2024-07-04 22:35:03.797541+00:00. Mimikatz is a tool used to harvest plaintext passwords, password hashes, smartcard PINs, and Kerberos tickets. The attacker might be leveraging this tool to harvest credentials to log into this or other devices on the network by impersonating a valid user. Several command line executions involving `mimikatz.exe` were observed, along with connected mimikatz-related files like `mimidrv.sys`, `mimispool.dll`, and `mimilove.exe`. More information can be found in the Mimikatz tool profile Threat Analytics report and the Actor profile: Storm-0875 Threat Analytics report provided by Microsoft."
      question: "Can you identify the IP address involved in the malicious credential theft tool execution detected?"

    evaluation_config:
      strategy: "static"
      criteria:
        expected_answers:
          - "107.224.99.179"
      scoring:
        max_score: 1.0

    subtasks:
      - subtask_id: "database_schema_exploration"
        title: "Database Schema Analysis"
        description: "Explore database structure and understand available security tables"
        objective: "Map database schema to identify relevant tables for incident analysis"

  - task_id: "incident_5_task_4"
    title: "incident_5_task_4"
    description: "Analyze security incident through database investigation to identify the URL involved in the security incident"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "On July 4, 2024, a security incident involving malware behavior named 'GenRansom' was detected on host `vnevado-win11t`. This malware was identified as active on the machine, and immediate precautionary measures were recommended. This incident is part of a broader malicious activity linked to the Manatee Tempest activity group. Manatee Tempest is a Russia-based cybercriminal group known for engaging in various sophisticated cyberattacks targeting numerous industries."
      question: "What is the URL associated with the Manatee Tempest activity group in this incident?"

    evaluation_config:
      strategy: "static"
      criteria:
        expected_answers:
          - "vectorsandarrows.com"
      scoring:
        max_score: 1.0

    subtasks:
      - subtask_id: "database_schema_exploration"
        title: "Database Schema Analysis"
        description: "Explore database structure and understand available security tables"
        objective: "Map database schema to identify relevant tables for incident analysis"

  - task_id: "incident_5_task_5"
    title: "incident_5_task_5"
    description: "Analyze ransomware activity through database investigation to identify the hostname involved in the security incident"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "During a recent investigation involving potentially compromised assets exhibiting ransomware-like behavior, it was observed that an attacker might be using the specified user account, IP, or device to move laterally across the network. Some of the files involved are `syncretic.7z.lockbit`, `earlap.doc`, `ponceau.7z`, and `unstreaming.xlsx.lockbit`. The suspicious activities were noted on the host `vnevado-win11u`, with associated account SID `S-0-6-5`. Automated remediation actions might be taken to disable the account or device being used by the attacker."
      question: "Can you identify the hostname of the device where system recovery setting tampering was observed?"

    evaluation_config:
      strategy: "static"
      criteria:
        expected_answers:
          - "vnevado-win10s"
      scoring:
        max_score: 1.0

    subtasks:
      - subtask_id: "database_schema_exploration"
        title: "Database Schema Analysis"
        description: "Explore database structure and understand available security tables"
        objective: "Map database schema to identify relevant tables for incident analysis"
