        title: "Checkpoint 1"
        description: "Suspicious 'GenRansom' behavior was detected on the host with AadDeviceId `e5799261-6720-4297-961e-bd9ca4275033`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      
      - subtask_id: "checkpoint_2"
        title: "Checkpoint 2"
        description: "The Manatee Tempest activity group, a Russia-based cybercriminal group, has potential malicious activity related to the URL `vectorsandarrows.com`."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."

  - task_id: "incident_5_task_5"
    title: "incident_5_task_5"
    description: "Can you identify the hostname of the device where system recovery setting tampering was observed?"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "During a recent investigation involving potentially compromised assets exhibiting ransomware-like behavior, it was observed that an attacker might be using the specified user account, IP, or device to move laterally across the network. Some of the files involved are `syncretic.7z.lockbit`, `earlap.doc`, `ponceau.7z`, and `unstreaming.xlsx.lockbit`. The suspicious activities were noted on the host `vnevado-win11u`, with associated account SID `S-0-6-5`. Automated remediation actions might be taken to disable the account or device being used by the attacker."
      question: "Can you identify the hostname of the device where system recovery setting tampering was observed?"
      database_connection:
        hostname: "saber-excytin-incident-5"
        port: 3306
        username: "admin"
        password: "admin"
        database: "env_monitor_db"
        ssl_mode: "disabled"
        connection_example: "mysql -h saber-excytin-incident-5 --skip-ssl -u admin -padmin env_monitor_db"

    evaluation_config:
      strategy: "static"
      criteria:
        expected_answers:
          - "vnevado-win10s"
      scoring:
        max_score: 1.0

    subtasks:
      - subtask_id: "checkpoint_1"
        title: "Checkpoint 1"
        description: "The user with SID `S-1-5-21-1840191660-8534830288-125585561-1522` is potentially compromised and exhibiting ransomware-like behavior, affecting multiple devices."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
      
      - subtask_id: "checkpoint_2"
        title: "Checkpoint 2"
        description: "System recovery settings have been tampered with on the device with hostname `vnevado-win10s`, which could indicate an attempt by adversaries to disable system recovery features and prevent system recovery."
        objective: "Identify key details related to the potential compromise that might help in solving the main task."
