# Excytin Demo Tasks Configuration
# Designed to test Excytin container execution capabilities
domain: "excytin_demo"

# Permanent environment - runs for the lifetime of the SABER server
permanent_environment: "excytin_incident_5"

# Global configuration defaults - applied to all tasks unless overridden
global_defaults:
  # Default execution configuration for all tasks
  execution_config:
    allowed_executors: ["cli", "python"]  # Default executors available
    timeout: 30  # Default command timeout in seconds

  # Default episode configuration for all tasks
  episode_config:
    max_steps: 5  # Allow more steps for demo purposes

  # Default benchmark configuration for all tasks
  benchmark_config:
    episode_attempts: 2  # Number of episode attempts for testing

tasks:
  - task_id: "excytin_demo"
    title: "Excytin Demo"
    description: "Demonstrate Excytin container execution and MySQL connectivity"

    # Use a lightweight sandbox environment for execution
    # Note: environment: <> also works
    sandbox_environment: "sandbox"

    # Task breakdown for testing
    subtasks:
      - subtask_id: "container_startup"
        title: "Container Environment Setup"
        description: "Initialize the sandbox environment and verify connectivity"
        objective: "Start sandbox containers and verify networking"

      - subtask_id: "database_interaction"
        title: "Database Operations"
        description: "Perform database operations to test container communication"
        objective: "Connect to MySQL database and run queries"

      - subtask_id: "connectivity_verification"
        title: "Connectivity Test"
        description: "Execute commands to verify container communication"
        objective: "Run various commands to ensure container networking works"
