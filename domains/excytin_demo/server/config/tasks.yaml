      question: "What is the URL associated with the Manatee Tempest activity group in this incident?"
      database_connection:
        hostname: "saber-excytin-incident-5"
        port: 3306
        username: "admin"
        password: "admin"
        database: "env_monitor_db"
        ssl_mode: "disabled"
        connection_example: "mysql -h saber-excytin-incident-5 --skip-ssl -u admin -padmin env_monitor_db"

