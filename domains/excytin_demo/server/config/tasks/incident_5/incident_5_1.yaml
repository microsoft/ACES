tasks:
  - task_id: "incident_5_task_1"
    title: "incident_5_task_1"
    description: "What is the IP address associated with the Manatee Tempest activity
      group detected in this security incident?"
    prompt_template_file: "excytin_demo.md"

    sandbox_environment: "excytin_sandbox"

    initial_context:
      incident_context: "A command and control behavior was blocked on host `vnevado-win10r`,
        which indicated an active infection by malware that could replicate and receive
        commands from remote attackers. This malware was active, and precautionary measures
        should be taken to check for residual signs of infection. The process involved
        had the ID 1332 and ran the command `curl http://vectorsandarrows.com`."
      question: "What is the IP address associated with the Manatee Tempest activity
        group detected in this security incident?"

    evaluation_config:
      strategy: "llm_judge"
      criteria:
        golden_answer: "Agent should identify the ip address associated with the Manatee Tempest activity is 198.43.121.209"
        model: "openai/azure/gpt-4.1"
        judge_system_template: "cybersecurity_incident_system.md"
        judge_user_template: "cybersecurity_incident_user.md"
      scoring:
        max_score: 1.0

    # evaluation_config:
    #   strategy: static
    #   criteria:
    #     expected_answers:
    #     - 198.43.121.209
    #   scoring:
    #     max_score: 1.0

    subtasks:
      - subtask_id: "checkpoint_1"
        title: "Checkpoint 1"
        description: "The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`
          was involved in a Command and Control behavior that was blocked."
        objective: "Identify key details related to the potential compromise that might
          help in solving the main task."

      - subtask_id: "checkpoint_2"
        title: "Checkpoint 2"
        description: "The cybercriminal group known as Manatee Tempest, which is associated
          with the IP address `198.43.121.209`, was active during the incident."
        objective: "Identify key details related to the potential compromise that might
          help in solving the main task."

  - task_id: incident_5_task_2
    title: incident_5_task_2
    description: What is the command line of the suspicious process involved in the
      user behavior change on device `vnevado-win11u`?
    prompt_template_file: excytin_demo.md

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: An incident involving a ransomware payload remotely launched
        on device `vnevado-win11u` with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`
        and IP address `99.83.111.100` has been detected. The attackers might be attempting
        to encrypt content on this device. Additionally, there is a notable change in
        typical user behavior that may indicate a compromise.
      question: What is the command line of the suspicious process involved in the user
        behavior change on device `vnevado-win11u`?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - 88__2024-06-20t09:29:42.3927529z__curl http://vectorsandarrows.com
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: A ransomware payload was remotely launched by the user with SID `S-1-5-21-1840191660-8534830288-125585561-1522`
        at `2024-07-04 22:35:03.038773+00:00`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: Suspicious hands on keyboard user behavior was detected on this device,
        involving a process with Process ID `88` launched with the command line `curl
        http://vectorsandarrows.com` at `2024-06-20t09:29:42.3927529z`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

  - task_id: incident_5_task_3
    title: incident_5_task_3
    description: Can you identify the IP address involved in the malicious credential
      theft tool execution detected?
    prompt_template_file: excytin_demo.md

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: 'A Mimikatz credential theft tool was detected on a device at
        2024-07-04 22:35:03.797541+00:00. Mimikatz is a tool used to harvest plaintext
        passwords, password hashes, smartcard PINs, and Kerberos tickets. The attacker
        might be leveraging this tool to harvest credentials to log into this or other
        devices on the network by impersonating a valid user. Several command line executions
        involving `mimikatz.exe` were observed, along with connected mimikatz-related
        files like `mimidrv.sys`, `mimispool.dll`, and `mimilove.exe`. More information
        can be found in the Mimikatz tool profile Threat Analytics report and the Actor
        profile: Storm-0875 Threat Analytics report provided by Microsoft.'
      question: Can you identify the IP address involved in the malicious credential
        theft tool execution detected?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - 107.224.99.179
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: The Mimikatz credential theft tool was detected on the device with
        IP address `107.224.99.179`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: A malicious credential theft tool execution was detected on the same
        device with IP address `107.224.99.179`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

  - task_id: incident_5_task_4
    title: incident_5_task_4
    description: What is the URL associated with the Manatee Tempest activity group
      in this incident?
    prompt_template_file: excytin_demo.md

    sandbox_environment: excytin_sandbox

    initial_context:
      incident_context: On July 4, 2024, a security incident involving malware behavior
        named 'GenRansom' was detected on host `vnevado-win11t`. This malware was identified
        as active on the machine, and immediate precautionary measures were recommended.
        This incident is part of a broader malicious activity linked to the Manatee
        Tempest activity group. Manatee Tempest is a Russia-based cybercriminal group
        known for engaging in various sophisticated cyberattacks targeting numerous
        industries.
      question: What is the URL associated with the Manatee Tempest activity group in
        this incident?

    evaluation_config:
      strategy: static
      criteria:
        expected_answers:
        - vectorsandarrows.com
      scoring:
        max_score: 1.0
    subtasks:
    - subtask_id: checkpoint_1
      title: Checkpoint 1
      description: Suspicious 'GenRansom' behavior was detected on the host with AadDeviceId
        `e5799261-6720-4297-961e-bd9ca4275033`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.

    - subtask_id: checkpoint_2
      title: Checkpoint 2
      description: The Manatee Tempest activity group, a Russia-based cybercriminal
        group, has potential malicious activity related to the URL `vectorsandarrows.com`.
      objective: Identify key details related to the potential compromise that might
        help in solving the main task.
