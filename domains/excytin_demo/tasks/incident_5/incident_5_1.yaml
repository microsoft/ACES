tasks:
  - task_id: "incident_5_task_1"
    title: "incident_5_task_1"
    description: "What is the IP address associated with the Manatee Tempest activity
      group detected in this security incident?"

    inherit_shared: true
    initial_context:
      incident_context: "A command and control behavior was blocked on host `vnevado-win10r`,
        which indicated an active infection by malware that could replicate and receive
        commands from remote attackers. This malware was active, and precautionary measures
        should be taken to check for residual signs of infection. The process involved
        had the ID 1332 and ran the command `curl http://vectorsandarrows.com`."
      question: "What is the IP address associated with the Manatee Tempest activity
        group detected in this security incident?"

    tools:
      python:
        timeout: 180

    scoring:
      static:
        submission:
          target: submission
          expected_answers:
            - "198.43.121.209"
          max_score: 1.0
        checkpoint_2:
          target: trajectory
          expected_answers:
            - "Manatee Tempest"
          max_score: 1.0
          weight: 0.25
          title: "Checkpoint 2"
          description: "The cybercriminal group known as Manatee Tempest, which is associated
            with the IP address `198.43.121.209`, was active during the incident."
      llm_judge:
        checkpoint_1:
          target: trajectory
          model: "openai/azure/gpt-4.1"
          judge_system_template: "judge/step/cybersecurity_subtask_incident_system.j2"
          judge_user_template: "judge/step/cybersecurity_subtask_incident_user.j2"
          steps_per_message: 10
          max_score: 1.0
          weight: 0.5
          title: "Checkpoint 1"
          description: "The account with SID `S-1-5-21-1840191660-8534830288-125585561-1522`
            was involved in a Command and Control behavior that was blocked."
      tool_call:
        checkpoint_3:
          target: trajectory
          expected_tools:
            - "bash"
          max_score: 1.0
          weight: 0.25
          title: "Checkpoint 3"
          description: "The cybercriminal group known as Manatee Tempest, which is associated
            with the IP address `198.43.121.209`, was active during the incident."

    scoring_aggregation:
      max:
        scores:
          - submission
          - [checkpoint_1, checkpoint_2, checkpoint_3]

  - task_id: incident_5_task_2
    title: incident_5_task_2
    description: What is the command line of the suspicious process involved in the
      user behavior change on device `vnevado-win11u`?

    inherit_shared: true

    initial_context:
      incident_context: An incident involving a ransomware payload remotely launched
        on device `vnevado-win11u` with AadDeviceId `bc00e484-d0e5-4da4-9472-95568cccc07e`
        and IP address `99.83.111.100` has been detected. The attackers might be attempting
        to encrypt content on this device. Additionally, there is a notable change in
        typical user behavior that may indicate a compromise.
      question: What is the command line of the suspicious process involved in the user
        behavior change on device `vnevado-win11u`?

    scoring:
      static:
        submission:
          target: submission
          expected_answers:
            - "curl http://vectorsandarrows.com"
          max_score: 1.0
