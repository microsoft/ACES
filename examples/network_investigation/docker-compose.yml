version: '3.8'

services:
  # SABER Server - Network Investigation Domain
  saber-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: saber-network-investigation-server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/workspace:cached
      - ./data:/workspace/data:cached
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker execution
      - ../../src:/saber-src:ro  # Mount SABER source code
    networks:
      - saber-network
    environment:
      - PYTHONPATH=/workspace/src:/saber-src
      - SABER_DOMAIN=network_investigation
      - SABER_PORT=8000
      - SABER_LOG_LEVEL=INFO
    command: ["/workspace/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    privileged: true  # Required for Docker-in-Docker

  # SABER Client - Network Investigation Agent
  saber-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: saber-network-investigation-client
    volumes:
      - ./client:/workspace:cached
      - ../../src:/saber-src:ro  # Mount SABER source code
    networks:
      - saber-network
    environment:
      - PYTHONPATH=/workspace/src:/saber-src
      - SABER_SERVER_URL=http://saber-server:8000
      - SABER_CLIENT_ID=network_investigation_agent
      - SABER_LOG_LEVEL=INFO
    depends_on:
      saber-server:
        condition: service_healthy
    command: ["/workspace/entrypoint.sh"]
    restart: unless-stopped

networks:
  saber-network:
    driver: bridge
