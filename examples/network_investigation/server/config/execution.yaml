# Execution Configuration for Network Investigation Domain

# Execution settings
execution:
  timeout: 300                    # Command timeout in seconds
  max_concurrent: 10              # Maximum concurrent executions

# Security configuration
security:
  max_command_length: 2000        # Maximum command length
  allowed_commands:               # Global whitelist of allowed commands
    - "netstat"
    - "ss"
    - "lsof"
    - "file"
    - "strings"
    - "hexdump"
    - "ps"
    - "ls"
    - "find"
    - "tcpdump"
    - "cat"
    - "grep"
    - "awk"
    - "sed"

# CLI-specific settings
cli:
  default_shell_mode: false        # Default shell mode for CLI tool

# Sandbox configuration (required)
sandbox:
  cleanup_on_session_end: true
  image: "network-investigation-sandbox:latest"
  working_dir: "/workspace"
  network_mode: "none"
  read_only_root: true
  user: "tooluser:tooluser"
  resource_limits:
    memory: "1g"
    cpu: "1.0"
    disk_space: "2g"
    execution_timeout: 300
  tmpfs:
    - "/tmp:size=200m,noexec"
  volumes:
    - type: "tmpfs"
      target: "/workspace"
      options: "size=1g"

# Network Investigation specific settings
network_investigation:
  mock_execution: true              # Enable mock execution for demonstration
  validate_only: false              # Set to true to only validate without executing

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
