[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saber"
version = "0.2.0"
description = "Security Agent Benchmarking and Evaluation Research (SABER) - A distributed system for benchmarking agentic workflows in cybersecurity domains"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "SABER Team"}
]
keywords = ["security", "agent", "benchmark", "cybersecurity", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "docker[compose]>=7.0.0",
    "httpx>=0.24.0",
    "httpx-sse>=0.4.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "fastmcp>=2.14.0",
    "websockets>=11.0.0",
    "aiohttp>=3.12.15",
    "python-dotenv>=1.1.1",
    "openai>=1.101.0",
    "click>=8.0.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    # Security: pin minimum safe versions
    "urllib3>=2.6.0",
    "filelock>=3.20.1",
    "mcp>=1.23.0",
    # inspect-ai dependency managed via tool.uv.sources for flexible installation
    "inspect-ai",
    "azure-identity>=1.25.1",
]

[project.optional-dependencies]
copilot = [
    # GitHub Copilot agent support (requires Node.js 22+ and Copilot CLI)
    "github-copilot-sdk>=0.1.13",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
server = [
    # Server-specific optional dependencies can go here
]
client = [
    # Client-specific optional dependencies can go here
]

# Installation method variants
local-dev = [
    # Dependencies for local development with external inspect_ai directory (now default)
    # No additional dependencies needed - just changes the source
]

[project.scripts]
saber-server = "saber.server.cli:main"
saber-client = "saber.client.cli:main"
saber-mcp-service = "saber.mcp_service.__main__:cli"
saber-domain = "saber.domain.cli:main"
inspect = "inspect_ai._cli.main:main"

[project.entry-points.inspect_ai]
saber = "saber.inspect_ai._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/saber"]
include = [
    "src/saber/domain/package_resources/**/*.yml",
    "src/saber/domain/package_resources/**/*.yaml",
    "src/saber/domain/package_resources/**/*.json",
    "src/saber/domain/package_resources/**/*.example",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
inspect-ai = { git = "https://MSECAIModels@dev.azure.com/MSECAIModels/Benchmarking/_git/inspect_ai", branch = "dev/saber_integration" }

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "docs/",
    "tests/",
    "data/",
    "src/saber/domain/package_resources/**",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "*/targets/*",
    "*/.archive/*",
    "examples/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E203",   # whitespace before ':'
    "E402",   # module level import not at top of file
    "UP038",  # Use X | Y in isinstance - tuple form is valid and often clearer
]

[tool.ruff.lint.isort]
known-first-party = ["saber"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# FastAPI decorators don't have complete type stubs
[[tool.mypy.overrides]]
module = [
    "saber.server.api.session_rest_api",
    "saber.server.api.session_mcp_api",
    "src.saber.server.api.session_rest_api",
    "src.saber.server.api.session_mcp_api",
]
disallow_untyped_decorators = false

# MCP decorators don't have complete type stubs
[[tool.mypy.overrides]]
module = [
    "saber.client.mcp_service.*",
    "src.saber.client.mcp_service.*",
]
disallow_untyped_decorators = false

# inspect_ai decorators don't have type stubs
[[tool.mypy.overrides]]
module = [
    "saber.inspect_ai.agents.solver_factory",
    "saber.inspect_ai.core.saber_scorer",
    "src.saber.inspect_ai.agents.solver_factory",
    "src.saber.inspect_ai.core.saber_scorer",
]
disallow_untyped_decorators = false

# Click's Path type has a known issue with path_type=Path (types-click bug)
# See: https://github.com/pallets/click/issues/2558
[[tool.mypy.overrides]]
module = [
    "saber.client.cli",
    "saber.domain.cli",
    "src.saber.client.cli",
    "src.saber.domain.cli",
]
disable_error_code = ["type-var"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config -m 'not integration' -p no:warnings"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::beartype.roar.BeartypeDecorHintPep585DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (run with -m integration)",
    "unit: marks tests as unit tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src", "."]
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.paths]
source = [
    "src/saber",
    "*/saber/src/saber",
    "saber",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "types-pyyaml>=6.0.12.20250822",
    "types-requests>=2.32.4.20250913",
]
