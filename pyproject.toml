[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saber"
version = "0.2.0"
description = "Agent Capability Evaluation Suite (ACES) / Security Agent Benchmarking and Evaluation Research (SABER) — A library for benchmarking agentic workflows in cybersecurity domains. ACES is the external name; SABER is the internal Microsoft codename."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "SABER Team"}
]
keywords = ["security", "agent", "benchmark", "cybersecurity", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "docker>=7.0.0",
    "httpx>=0.24.0",
    "httpx-sse>=0.4.0",
    "requests>=2.28.0",
    "rich>=14.0.0",
    "typer>=0.15.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "fastmcp>=2.14.0",
    "websockets>=11.0.0",
    "aiohttp>=3.12.15",
    "python-dotenv>=1.1.1",
    # openai floor raised for the inspect-ai fork agent bridge (react/copilot
    # harnesses require the Responses API in openai>=2.40.0).
    "openai>=2.40.0",
    "click>=8.0.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    # Security: pin minimum safe versions
    "urllib3>=2.6.0",
    "filelock>=3.20.1",
    "mcp>=1.23.0",
    # inspect-ai dependency managed via tool.uv.sources for flexible installation
    "inspect-ai",
    "azure-identity>=1.25.1",
    # anthropic floor raised for the inspect-ai agent bridge (claude_code harness
    # generate_anthropic path requires >=0.105.0).
    "anthropic>=0.105.0",
    "watchfiles>=1.1.1",
    "ruamel-yaml>=0.18.0",
]

[project.optional-dependencies]
copilot = ["github-copilot-sdk>=0.3.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "fakeredis[lua]>=2.21.0",
]

[project.scripts]
inspect = "inspect_ai._cli.main:main"
saber = "saber.cli.app:app"

[project.entry-points.inspect_ai]
saber = "saber.inspect_ai._registry"

[tool.hatch.build.targets.wheel]
packages = ["src/saber"]
include = [
    "src/saber/domain/package_resources/**/*.yml",
    "src/saber/domain/package_resources/**/*.yaml",
    "src/saber/domain/package_resources/**/*.json",
    "src/saber/domain/package_resources/**/*.example",
]

[tool.hatch.build.targets.wheel.force-include]
"docker/Dockerfile.saber_sandbox" = "saber/environments/_dockerfiles/Dockerfile.saber_sandbox"
"docker/Dockerfile.saber_sandbox_agents" = "saber/environments/_dockerfiles/Dockerfile.saber_sandbox_agents"
# Ship the empty wheels/ and npm/ dirs (so `COPY wheels/` and `COPY npm/` resolve
# when the base image is rebuilt from the installed package) plus the scripts that
# populate them. The artifacts themselves are deliberately not packaged - they are
# fallbacks for networks that block PyPI/npm, and bundling them would ship stale
# pins and hundreds of MB.
"docker/wheels/.gitkeep" = "saber/environments/_dockerfiles/wheels/.gitkeep"
"docker/npm/.gitkeep" = "saber/environments/_dockerfiles/npm/.gitkeep"
"docker/fetch_wheels.sh" = "saber/environments/_dockerfiles/fetch_wheels.sh"
"docker/fetch_npm.sh" = "saber/environments/_dockerfiles/fetch_npm.sh"

[tool.hatch.metadata]
allow-direct-references = true

# inspect-ai: REQUIRED fork on the ACESEvals `inspect-ai/dev/aces_integration`
# branch. It powers the agent harnesses (`-T agent=copilot`, `-T agent=claude_code`)
# and tool_call limits — none of which exist in upstream inspect_ai. Do NOT switch
# this to upstream inspect-ai, or the harness / agent-architecture evals break. This
# branch must continue to be maintained on GitHub.
[tool.uv.sources]
inspect-ai = { git = "https://github.com/microsoft/ACESEvals", branch = "inspect-ai/dev/aces_integration" }
# For local development against a checkout:
#   inspect-ai = { path = "../inspect_ai", editable = true }

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "docs/",
    "tests/",
    "data/",
    "docker/Dockerfile.saber_sandbox",
    "src/saber/domain/package_resources/**",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "*/targets/*",
    "*/.archive/*",
    "examples/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E203",   # whitespace before ':'
    "E402",   # module level import not at top of file
    "UP038",  # Use X | Y in isinstance - tuple form is valid and often clearer
]

[tool.ruff.lint.isort]
known-first-party = ["saber"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# inspect_ai decorators don't have type stubs
[[tool.mypy.overrides]]
module = [
    "saber.inspect_ai._registry",
    "src.saber.inspect_ai._registry",
]
disallow_untyped_decorators = false

# Click's Path type has a known issue with path_type=Path (types-click bug)
# See: https://github.com/pallets/click/issues/2558
[[tool.mypy.overrides]]
module = [
    "saber.domain.cli",
    "src.saber.domain.cli",
]
disable_error_code = ["type-var"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config -m 'not integration' -p no:warnings"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::beartype.roar.BeartypeDecorHintPep585DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (run with -m integration)",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests (run with -m e2e)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src", "."]
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.paths]
source = [
    "src/saber",
    "*/saber/src/saber",
    "saber",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.14.10",
    "types-pyyaml>=6.0.12.20250822",
    "types-requests>=2.32.4.20250913",
]
