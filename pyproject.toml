[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saber"
version = "0.1.0"
description = "Security Agent Benchmarking and Evaluation Research (SABER) - A distributed system for benchmarking agentic workflows in cybersecurity domains"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SABER Team"}
]
keywords = ["security", "agent", "benchmark", "cybersecurity", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pydantic-ai[logfire]>=0.6.2",
    "fastmcp>=2.10.6",
    "tiktoken>=0.11.0",
    "networkx>=3.4.2",
    "pandas>=2.3.1",
    "sqlalchemy>=2.0.43",
    "gymnasium>=1.2.0",
    "numpy>=1.26.4",
    "rich>=14.0.0",
    "pyautogen==0.2.35",
    "azure-identity>=1.24.0",
    "azure-monitor-query>=2.0.0",
    "mysql-connector-python>=9.4.0",
    "python-levenshtein>=0.27.1",
    "matplotlib>=3.10.5",
    "azure-ai-ml>=1.28.1",
    "azure-ai-inference>=1.0.0b9",
    "bs4>=0.0.2",
    "datasets>=4.0.0",
    "langchain-huggingface>=0.3.1",
    "langchain-openai>=0.3.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "fastmcp>=0.1.0",
]
client = [
    "httpx>=0.24.0",
    "websockets>=11.0.0",
]

[project.urls]
Homepage = "https://github.com/saber-team/saber"
Documentation = "https://saber.readthedocs.io"
Repository = "https://github.com/saber-team/saber"
Issues = "https://github.com/saber-team/saber/issues"

[project.scripts]
saber-server = "saber.server.cli:main"
saber-client = "saber.client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/saber"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "docs/",
    "tests/",
    "data/",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
