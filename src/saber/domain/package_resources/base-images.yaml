# SABER Base Images Configuration
# Defines all base images that domains can extend from
#
# When running from repo: builds from docker/ directory
# When installed as package: pulls from ACR registry
#
# NOTE: The SABER server now runs as a host subprocess, NOT in a container.
# Only sandbox base images are needed.

schemaVersion: "1.0.0"

# Container registry for pre-built images (used when not in repo)
registry: "acr3ambenw4rfvbc.azurecr.io"

images:
  # Sandbox base image (REQUIRED for sandbox containers)
  sandbox:
    tag: "saber/sandbox:latest"
    dockerfile: "docker/Dockerfile.saber_sandbox"
    registry_image: "saber-sandbox"
    labels:
      saber.component: "base-sandbox"
      saber.type: "base-image"
