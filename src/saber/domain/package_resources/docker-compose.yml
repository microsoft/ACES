# DEPRECATED: Server Docker Compose Configuration
#
# NOTE: As of 2026-02, the SABER server runs as a HOST SUBPROCESS, not in a container.
# This file is kept for backwards compatibility and documentation purposes only.
# The DomainOrchestrator now uses subprocess.Popen to start the server directly.
#
# Benefits of host subprocess deployment:
# - Eliminates Docker-in-Docker issues
# - Allows direct host path mounts for sandbox containers
# - Simplifies networking between server and managed containers
# - Better debugging with native server execution
#
# If you need to run the server in a container for some reason, you can still
# use this compose file manually, but it's not recommended.

services:
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE environment variable must be set}
    container_name: ${DOMAIN}-saber-server
    hostname: ${DOMAIN}-server
    environment:
      SABER_DOMAIN: ${DOMAIN}
      SABER_CONFIG_DIR: /app/config
      SABER_DOMAINS_ROOT: /app/domains
      SABER_HOST: 0.0.0.0
      SABER_PORT: ${REST_PORT:-8000}
      SABER_MCP_PORT: ${MCP_PORT:-8001}
      SABER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${REST_PORT:-8000}:${REST_PORT:-8000}"
      - "${MCP_PORT:-8001}:${MCP_PORT:-8001}"
    volumes:
      # Domain-specific mounts
      - ${DOMAINS_ROOT:?DOMAINS_ROOT must be set}/${DOMAIN}/server/config:/app/config:ro
      - ${DOMAINS_ROOT}/${DOMAIN}/server/docker:/app/docker:ro
      - ${DOMAINS_ROOT}/${DOMAIN}/server/logs:/app/logs:rw
      - ${DOMAINS_ROOT}/${DOMAIN}/server/data:/app/data:rw
      # Cross-domain visibility with writable logs
      - ${DOMAINS_ROOT}:/app/domains:rw
      # SABER source code for live development - mount entire saber package for editable install
      # SABER_SRC can be customized in .env for different repo structures:
      # - standalone saber repo: SABER_SRC=${DOMAINS_ROOT}/..
      # - oss_saber repo: SABER_SRC=${DOMAINS_ROOT}/../../external/saber
      - ${SABER_SRC:?SABER_SRC must be set}:/tmp/saber:rw
      # Docker socket for sandbox management (always included)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Azure CLI credentials for git authentication (if they exist on host)
      - ${HOME}/.azure:/root/.azure:rw
      # Environment file with API keys and credentials (mounted from repo root)
      - ${ENV_FILE:?ENV_FILE must be set}:/app/.env:ro
    networks:
      - domain-network
    security_opt:
      - no-new-privileges:false
    user: root
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${REST_PORT:-8000}/api/v1/health"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  domain-network:
    name: ${DOMAIN}-saber-network

volumes:
  server-data:
    name: ${DOMAIN}-saber-server-data
