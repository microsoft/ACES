# Tool Configuration for CLI-Only Registry

# Execution settings for the single CLI tool
execution:
  timeout: 120                    # Shorter timeout for testing
  max_concurrent: 5               # Lower concurrency for testing

# Security configuration
security:
  max_command_length: 1000          # Shorter limit for testing
  allowed_commands:                 # Global whitelist of allowed commands
    - "file"
    - "strings"
    - "echo"
    - "cat"
    - "ls"

# CLI-specific settings
cli:
  default_shell_mode: false        # Default shell mode for CLI tool

# Test-specific settings
test_settings:
  mock_execution: true              # Enable mock execution for tests
  validate_only: false              # Set to true to only validate without executing

# Logging configuration for tests
logging:
  level: DEBUG
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
