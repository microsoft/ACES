# ToolRegistry Configuration

tools:
  # Domains to load
  domains:
    - malware
    - threat_investigation
    - forensics

  # Execution settings
  execution:
    timeout: 300          # Default timeout in seconds
    max_concurrent: 10    # Maximum concurrent tool executions

  # Tool-specific configuration
  enabled:
    - file_hash_analyzer
    - file_metadata_extractor
    - string_extractor
    - ip_reputation_checker
    - domain_analyzer
    - url_analyzer
    - log_parser
    - timeline_constructor

  disabled: []            # Tools to disable

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
